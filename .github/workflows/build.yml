# 콩나물지기 자동 빌드 — Windows·맥 실행 파일을 만들고 Audiveris(공식 5.11.0)를 함께 넣는다.
#  · main에 올릴 때 / 수동 실행: 빌드 결과를 Actions 화면의 'Artifacts'에 올린다.
#  · v로 시작하는 태그(예: v3.30)를 올릴 때: 같은 파일로 Releases(내려받기 페이지)를 만든다.
# Audiveris는 저장소에 넣지 않고 빌드할 때마다 공식 배포 파일을 받아 넣는다(AGPL 고지 포함).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  AUDIVERIS_VER: "5.11.0"
  PYTHONIOENCODING: utf-8          # Windows 콘솔(cp1252)에서 한글 출력이 깨져 실패하지 않게
  PYTHONUTF8: "1"
  AUDIVERIS_URL: https://github.com/Audiveris/audiveris/releases/download

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 파이썬 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 버전 읽기
        shell: bash
        run: |
          VER=$(python -c "import re;print(re.search(r'^APP_VERSION\s*=\s*\"([^\"]+)\"',open('editor_app_qt.py',encoding='utf-8').read(),re.M).group(1))")
          echo "VER=$VER" >> $GITHUB_ENV
          echo "APP=OMRSprouty_v${VER//./_}" >> $GITHUB_ENV

      - name: 릴리스할 버전인지 확인 (새 버전이면 내려받기 페이지에 올림)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v 태그를 올렸거나, main에 올린 APP_VERSION의 릴리스가 아직 없으면 → 이 빌드를 Releases에 올린다
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "DO_RELEASE=1" >> $GITHUB_ENV
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && ! gh release view "v$VER" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "DO_RELEASE=1" >> $GITHUB_ENV
          fi

      - name: 실행 파일 만들기 (PyInstaller)
        run: pyinstaller --noconfirm OMREditor.spec

      - name: Audiveris 받아서 풀기 (MSI 관리 설치)
        shell: pwsh
        run: |
          $msi = "Audiveris-$env:AUDIVERIS_VER-windows-x86_64.msi"
          Invoke-WebRequest "$env:AUDIVERIS_URL/$env:AUDIVERIS_VER/$msi" -OutFile $msi
          $x = Join-Path $PWD "aud_x"
          Start-Process msiexec.exe -Wait -ArgumentList "/a `"$PWD\$msi`" /qn TARGETDIR=`"$x`""
          $exe = Get-ChildItem $x -Recurse -Filter Audiveris.exe | Select-Object -First 1
          if (-not $exe) { Get-ChildItem $x -Recurse | Select-Object -First 50 FullName; throw "Audiveris.exe를 찾지 못함" }
          Write-Host "Audiveris.exe: $($exe.FullName)"
          New-Item -ItemType Directory -Force audiveris_ci | Out-Null
          Copy-Item $exe.Directory.FullName "audiveris_ci\audiveris" -Recurse
          Copy-Item LICENSE_Audiveris_AGPLv3.txt "audiveris_ci\audiveris\" -ErrorAction SilentlyContinue
          Get-ChildItem audiveris_ci\audiveris | Select-Object Name

      - name: 인식 점검 (Audiveris가 실제로 악보를 읽는지)
        shell: bash
        run: |
          export AUDIVERIS_BIN="$PWD/audiveris_ci/audiveris/Audiveris.exe"
          python tools/smoke_audiveris.py resource_dist/demo_song_hires.png 900

      - name: 설치 프로그램 만들기 (Inno Setup)
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAudiverisDir=audiveris_ci\audiveris" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 실패" }
          Get-ChildItem Output

      - name: 폴더 묶기 (실행 파일 + _internal + audiveris)
        shell: pwsh
        run: |
          Copy-Item "audiveris_ci\audiveris" "dist\$env:APP\audiveris" -Recurse
          Copy-Item LICENSE_AGPLv3.txt, RUNNING_GUIDE.md "dist\$env:APP\"
          Compress-Archive -Path "dist\$env:APP" -DestinationPath "${env:APP}_Windows.zip"
          Get-Item "${env:APP}_Windows.zip" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}_Windows
          path: |
            ${{ env.APP }}_Windows.zip
            Output/*.exe
          if-no-files-found: warn

      - name: 릴리스에 올리기 (새 버전·태그일 때)
        if: env.DO_RELEASE == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: 콩나물지기 v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ env.APP }}_Windows.zip
            Output/*.exe
          fail_on_unmatched_files: false

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest        # Apple Silicon (M1~)
            arch: arm64
            optional: false
          - runner: macos-15-intel      # 예전 인텔 맥
            arch: x86_64
            optional: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 파이썬 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 버전 읽기
        run: |
          VER=$(python -c "import re;print(re.search(r'^APP_VERSION\s*=\s*\"([^\"]+)\"',open('editor_app_qt.py',encoding='utf-8').read(),re.M).group(1))")
          echo "VER=$VER" >> $GITHUB_ENV
          echo "APP=OMRSprouty_v${VER//./_}" >> $GITHUB_ENV

      - name: 릴리스할 버전인지 확인 (새 버전이면 내려받기 페이지에 올림)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v 태그를 올렸거나, main에 올린 APP_VERSION의 릴리스가 아직 없으면 → 이 빌드를 Releases에 올린다
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "DO_RELEASE=1" >> $GITHUB_ENV
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && ! gh release view "v$VER" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "DO_RELEASE=1" >> $GITHUB_ENV
          fi

      - name: 앱 만들기 (PyInstaller)
        run: |
          pyinstaller --noconfirm OMREditor.spec
          ls -la dist
          test -d "dist/$APP.app"

      - name: Audiveris 받아서 꺼내기 (DMG)
        run: |
          DMG="Audiveris-$AUDIVERIS_VER-macosx-${{ matrix.arch }}.dmg"
          curl -fL -o "$DMG" "$AUDIVERIS_URL/$AUDIVERIS_VER/$DMG"
          # DMG에 라이선스 동의 화면(AGPL)이 붙어 있어 그냥 열면 입력을 기다리다 실패한다 → 자동 동의
          yes | PAGER=cat hdiutil attach -nobrowse -readonly -mountpoint /Volumes/aud "$DMG" > /dev/null
          ls -la /Volumes/aud
          APPSRC=$(find /Volumes/aud -maxdepth 2 -name "*.app" | head -1)
          echo "Audiveris 앱: $APPSRC"
          mkdir -p "pkg/$APP/audiveris"
          ditto "$APPSRC" "pkg/$APP/audiveris/Audiveris.app"
          hdiutil detach /Volumes/aud
          ls -la "pkg/$APP/audiveris/Audiveris.app/Contents/MacOS"

      - name: 인식 점검 (Audiveris가 실제로 악보를 읽는지)
        run: |
          export AUDIVERIS_BIN="$PWD/pkg/$APP/audiveris/Audiveris.app/Contents/MacOS/Audiveris"
          python tools/smoke_audiveris.py resource_dist/demo_song_hires.png 900

      - name: 폴더 묶기 (앱 + audiveris + 첫 실행 도우미)
        run: |
          ditto "dist/$APP.app" "pkg/$APP/$APP.app"
          cp LICENSE_AGPLv3.txt RUNNING_GUIDE.md "pkg/$APP/"
          cp LICENSE_Audiveris_AGPLv3.txt "pkg/$APP/audiveris/" || true
          cat > "pkg/$APP/처음 한 번 실행.command" <<'EOF'
          #!/bin/bash
          # 인터넷에서 받은 앱에 붙는 '격리' 표시를 이 폴더에서만 지운다(콩나물지기와 Audiveris).
          # 지우지 않으면 맥이 "확인되지 않은 개발자" 경고를 띄우거나 악보 인식 엔진 실행을 막는다.
          cd "$(dirname "$0")"
          xattr -dr com.apple.quarantine . 2>/dev/null
          echo "준비가 끝났습니다. 이제 콩나물지기 앱을 두 번 눌러 여세요."
          open .
          EOF
          chmod +x "pkg/$APP/처음 한 번 실행.command"
          cd pkg && ditto -c -k --sequesterRsrc --keepParent "$APP" "../${APP}_Mac_${{ matrix.arch }}.zip"
          cd .. && ls -la *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}_Mac_${{ matrix.arch }}
          path: ${{ env.APP }}_Mac_${{ matrix.arch }}.zip

      - name: 릴리스에 올리기 (새 버전·태그일 때)
        if: env.DO_RELEASE == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: 콩나물지기 v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: ${{ env.APP }}_Mac_${{ matrix.arch }}.zip
